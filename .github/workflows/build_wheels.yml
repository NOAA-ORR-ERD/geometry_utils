name: Build

on:
  pull_request:
  push:
  release:
    types:
      - published

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # macos-latest is apple silicon
      # no windows-11-arm -- 'cause there isn't a numpy wheel for it
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: windows-latest
            arch: AMD64
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x86_64

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Building ${{ matrix.os }} (${{ matrix.arch }}) wheels"
        uses: pypa/cibuildwheel@8d2b08b68458a16aeb24b64e68a09ab1c8e82084  # v3.4.1
        env:
          CIBW_SKIP: "*-musllinux*"
          CIBW_BUILD: "cp311-* cp314-*"
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD_FRONTEND: build
          CIBW_TEST_REQUIRES: pytest abi3audit
          CIBW_TEST_COMMAND: >
            python -c "import geometry_utils; print(f'geometry_utils v{geometry_utils.__version__}')" &&
            python -m pytest --pyargs geometry_utils &&
            abi3audit ${{ github.workspace }}/wheelhouse/*.whl --summary --assume-minimum-abi3 3.11 --verbose --strict

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ${{ github.workspace }}/wheelhouse/*.whl
    permissions:
      actions: write

  make_sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      with:
        fetch-depth: 0  # Optional, use if you use setuptools_scm
        persist-credentials: false

    - name: Build SDist
      run: pipx run build --sdist

  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    needs: [build_wheels, make_sdist]
    environment:
      name: build_wheels
      url: https://pypi.org/project/geometry-utils/
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    if: success() && github.event_name == 'release'

    steps:
    - name: get wheels from artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        pattern: cibw-*
        path: ${{ github.workspace }}/dist
        merge-multiple: true

# got this from https://github.com/pypa/gh-action-pypi-publish
    # - name: Publish package distributions to PyPI
    #   uses: pypa/gh-action-pypi-publish@release/v1
    - name: Publish package distributions to TestPyPI
      uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
      with:
        repository-url: https://test.pypi.org/legacy/



